[project]
name = "ppt-ui"
version = "0.1.0"
description = "Compile XML decks into .pptx files with WPF-style layout"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lxml>=6.1.3",
    "pillow>=13.0.0",
    "python-pptx>=1.0.2",
]
keywords = ["ppt-gen", "xml", "pptx", "wpf", "layout"]

[project.scripts]
pptui = "pptui.cli:main"
