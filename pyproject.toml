[project]
name = "ppt-ui"
version = "0.1.0"
description = "Compile XML decks into .pptx files with WPF-style layout"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lxml>=6.1.3",
    "pillow>=13.0.0",
    "python-pptx>=1.0.2",
]
keywords = ["ppt-gen", "xml", "pptx", "wpf", "layout"]

[project.scripts]
pptui = "pptui.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pptui", "pptui.render"]

[tool.setuptools.package-data]
pptui = ["templates/*.pptx", "schema/*.xsd"]
